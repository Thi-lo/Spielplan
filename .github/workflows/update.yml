name: Kalender aktualisieren

on:
  schedule:
    - cron: "0 5 * * *"   # täglich um 05:00 UTC (ca. 6–7 Uhr deutscher Zeit)
  workflow_dispatch:       # erlaubt manuelles Starten per Klick

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install requests beautifulsoup4

      - name: Kalender erzeugen
        run: |
          mkdir -p docs
          python schauspiel_koeln_ical.py --debug --out docs/schauspielhaus.ics --log docs/aenderungen.md

      - name: Ergebnis speichern
        run: |
          git config user.name "kalender-bot"
          git config user.email "kalender-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Kalender aktualisiert"
          git push
